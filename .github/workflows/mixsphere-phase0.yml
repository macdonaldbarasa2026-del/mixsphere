name: Mixsphere Phase 0 - Android engine spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  BUILDENV_BASEPATH: /home/runner/buildenv

jobs:
  cpp-unit-tests:
    name: C++ DSP unit tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev libgtest-dev cmake g++
      - name: Configure
        run: cmake -S android-spike/native/tests -B build-host -DMIXXX_ROOT="$PWD"
      - name: Build
        run: cmake --build build-host --parallel
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  kotlin-unit-tests:
    name: Kotlin unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache Android dependencies
        uses: actions/cache@v4
        with:
          path: /home/runner/buildenv
          key: ${{ runner.os }}-mixsphere-android-arm64-${{ hashFiles('tools/android_buildenv.sh') }}
      - name: Set up Android SDK and NDK
        shell: bash
        run: source tools/android_buildenv.sh setup

      - name: Set up pinned Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"
          sudo env JAVA_HOME="$JAVA_HOME" sdkmanager "cmake;3.31.6"
      - name: Set up pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"

      - name: Export Qt prefix
        shell: bash
        run: echo "QT_ANDROID_CMAKE_PREFIX_PATH=${MIXXX_VCPKG_ROOT}/installed/arm64-android" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run JVM tests
        working-directory: android-spike
        run: gradle testDebugUnitTest --stacktrace

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: License and placeholder policy
        run: |
          set -e
          echo "Checking Phase 0 sources for forbidden placeholders"
          if grep -rInE 'TODO|FIXME|not implemented|placeholder' \
              android-spike/native android-spike/app/src 2>/dev/null; then
            echo "::error::placeholder markers found"; exit 1
          fi
          echo "static checks: PASS"

  ndk-build:
    name: NDK arm64-v8a - libmixsphere_engine.so
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer /opt/az /opt/google /opt/microsoft /opt/pipx
          sudo rm -rf /usr/lib/google-cloud-sdk /usr/local/julia1.11.7
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/powershell

      - name: Cache Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/buildenv
            android-spike/.fetchcontent
          key: ${{ runner.os }}-mixsphere-android-arm64-${{ hashFiles('tools/android_buildenv.sh', 'android-spike/native/CMakeLists.txt') }}

      - name: Set up pinned Android build environment
        shell: bash
        run: source tools/android_buildenv.sh setup

      - name: Set up pinned Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"
          sudo env JAVA_HOME="$JAVA_HOME" sdkmanager "cmake;3.31.6"

      - name: Set up pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"

      - name: Export Qt prefix for native spike
        shell: bash
        run: |
          echo "QT_ANDROID_CMAKE_PREFIX_PATH=${MIXXX_VCPKG_ROOT}/installed/arm64-android" >> "$GITHUB_ENV"
          echo "MIXXX_VCPKG_ROOT=${MIXXX_VCPKG_ROOT}" >> "$GITHUB_ENV"

      - name: Build native engine with Gradle/NDK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage Qt shared libraries for packaging
        shell: bash
        run: |
          mkdir -p android-spike/app/src/main/jniLibs/arm64-v8a
          shopt -s nullglob
          qt_libraries=("${QT_ANDROID_CMAKE_PREFIX_PATH}"/lib/*.so)
          if ((${#qt_libraries[@]} == 0)); then
            echo "No Qt Android shared libraries found under ${QT_ANDROID_CMAKE_PREFIX_PATH}/lib" >&2
            exit 1
          fi
          cp "${qt_libraries[@]}" android-spike/app/src/main/jniLibs/arm64-v8a/
          ls -la android-spike/app/src/main/jniLibs/arm64-v8a/ | head -30

      - name: Assemble debug APK
        working-directory: android-spike
        shell: bash
        run: gradle assembleDebug --stacktrace 2>&1 | tee ../apk-assemble.log

      - name: Upload native and APK artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-artifacts
          path: |
            apk-assemble.log
            android-spike/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  proof-of-life:
    name: Emulator proof of life (API 35)
    needs: [cpp-unit-tests, kotlin-unit-tests, ndk-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo apt-get autoremove -y && sudo apt-get clean
          sudo rm -rf /home/packer /opt/az /opt/google /opt/microsoft /opt/pipx
          sudo rm -rf /usr/lib/google-cloud-sdk /usr/local/julia1.11.7
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/powershell

      - name: Cache Android dependencies
        uses: actions/cache@v4
        with:
          path: |
            /home/runner/buildenv
            android-spike/.fetchcontent
          key: ${{ runner.os }}-mixsphere-android-arm64-${{ hashFiles('tools/android_buildenv.sh', 'android-spike/native/CMakeLists.txt') }}

      - name: Set up pinned Android build environment
        shell: bash
        run: source tools/android_buildenv.sh setup

      - name: Set up pinned Android SDK packages
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK}" >> "$GITHUB_ENV"
          sudo env JAVA_HOME="$JAVA_HOME" sdkmanager "cmake;3.31.6"

      - name: Set up pinned JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17.0.21.1+2"

      - name: Export Qt prefix
        shell: bash
        run: echo "QT_ANDROID_CMAKE_PREFIX_PATH=${MIXXX_VCPKG_ROOT}/installed/arm64-android" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Stage Qt shared libraries
        shell: bash
        run: |
          mkdir -p android-spike/app/src/main/jniLibs/arm64-v8a
          shopt -s nullglob
          qt_libraries=("${QT_ANDROID_CMAKE_PREFIX_PATH}"/lib/*.so)
          if ((${#qt_libraries[@]} == 0)); then
            echo "No Qt Android shared libraries found under ${QT_ANDROID_CMAKE_PREFIX_PATH}/lib" >&2
            exit 1
          fi
          cp "${qt_libraries[@]}" android-spike/app/src/main/jniLibs/arm64-v8a/

      - name: Run instrumented proof of life
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          profile: pixel_7
          disable-animations: true
          working-directory: android-spike
          script: |
            adb logcat -c
            gradle connectedDebugAndroidTest --stacktrace 2>&1 | tee ../instrumented.log
            adb logcat -d -s MixspherePhase0:I > ../phase0-logcat.txt
            cat ../phase0-logcat.txt
            grep -F "PHASE0_PROOF_OF_LIFE=PASS" ../phase0-logcat.txt
            grep -E "native_callback_micros=[1-9][0-9]*" ../phase0-logcat.txt
            grep -E "oboe_estimated_latency_ms=-?[0-9]+([.][0-9]+)?" ../phase0-logcat.txt

      - name: Upload proof-of-life evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-proof-of-life
          path: |
            instrumented.log
            phase0-logcat.txt
            android-spike/app/build/reports/androidTests/connected/**/*.html
          if-no-files-found: warn
